<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC Online CBT Examination Portal</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #3a506b 100%);
            --card-bg: rgba(23, 42, 69, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --emerald-accent: #10b981;
            --amber-accent: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        /* Ambient Glow Effects */
        .ambient-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(37, 99, 235, 0.2);
            filter: blur(100px);
            border-radius: 50%;
            top: 5%;
            left: 10%;
            z-index: 0;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            bottom: 5%;
            right: 10%;
            z-index: 0;
        }

        /* Hidden Creator / Admin Gear Button */
        .admin-secret-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            color: var(--text-sub);
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-secret-btn:hover {
            opacity: 1;
            color: #ef4444;
            transform: rotate(90deg);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Main Login Card Container */
        .portal-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 460px;
            padding: 44px 36px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Top Brand Badge & Info */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .portal-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(37, 99, 235, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.25);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .main-title {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .sub-badge-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .exam-chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .exam-divider {
            color: #64748b;
            font-size: 10px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-sub);
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .input-box-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 46px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box-wrapper input::placeholder {
            color: #64748b;
        }

        .input-box-wrapper input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        .input-box-wrapper input:focus + i {
            color: #60a5fa;
        }

        /* Buttons */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        .btn-emerald {
            background: var(--emerald-accent);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .btn-emerald:hover {
            background: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
        }

        .btn-amber {
            background: var(--amber-accent);
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
        }

        .btn-amber:hover {
            background: #d97706;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
        }

        /* Action Links */
        .action-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            font-size: 13px;
        }

        .action-links a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .action-links a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        /* Trust Badges Footer inside Card */
        .portal-features-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 500;
        }

        .feature-item i {
            font-size: 14px;
            color: var(--emerald-accent);
        }

        /* Modal Windows */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background: #172a45;
            border: 1px solid var(--card-border);
            padding: 36px 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: modalSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .close-icon {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 18px;
            color: var(--text-sub);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-icon:hover {
            color: var(--text-main);
        }

        .modal-heading {
            color: var(--text-main);
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .collapsible-step {
            display: none;
            margin-top: 22px;
            border-top: 1px solid var(--card-border);
            padding-top: 22px;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <!-- Hidden Creator / Admin Quick Access -->
    <button class="admin-secret-btn" onclick="openModal('creatorModal')" title="Admin Access">
        <i class="fa-solid fa-gear"></i>
    </button>

    <!-- Main Login Card -->
    <div class="portal-card">
        
        <div class="brand-header">
            <div class="portal-badge">
                <i class="fa-solid fa-laptop-code"></i> Official CBT Test Portal
            </div>
            
            <h1 class="main-title">TNPSC Examination</h1>
            
            <div class="sub-badge-group">
                <span class="exam-chip">Group I</span>
                <span class="exam-divider">•</span>
                <span class="exam-chip">Group II / IIA</span>
                <span class="exam-divider">•</span>
                <span class="exam-chip">Group IV</span>
            </div>
        </div>

        <!-- Student Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Mobile Number / Email ID</label>
                <div class="input-box-wrapper">
                    <input type="text" id="loginUserId" placeholder="பதிவுசெய்த மொபைல் அல்லது Email" required>
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-box-wrapper">
                    <input type="password" id="loginPassword" placeholder="உங்கள் கடவுச்சொல்" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>LOG IN TO PORTAL</span> 
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>

            <div class="action-links">
                <a href="#" onclick="openModal('forgotModal')">Forgot Password?</a>
                <a href="#" onclick="openModal('registerModal')">New Candidate Registration</a>
            </div>
        </form>

        <!-- Trust Badges Footer -->
        <div class="portal-features-footer">
            <div class="feature-item">
                <i class="fa-solid fa-circle-check"></i>
                <span>Live CBT Tests</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Instant Results</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Secure Batch</span>
            </div>
        </div>

    </div>

    <!-- Modal 1: New Student Registration -->
    <div id="registerModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-icon" onclick="closeModal('registerModal')"><i class="fa-solid fa-xmark"></i></span>
            
            <div class="modal-heading">
                <i class="fa-solid fa-user-plus" style="color: var(--emerald-accent);"></i>
                <span>புதிய தேர்வர் பதிவு (New Register)</span>
            </div>

            <div class="form-group">
                <label>முழு பெயர் (Full Name)</label>
                <div class="input-box-wrapper">
                    <input type="text" id="regName" placeholder="உங்கள் பெயரை உள்ளிடுக" required>
                    <i class="fa-regular fa-id-card"></i>
                </div>
            </div>

            <div class="form-group">
                <label>மின்னஞ்சல் முகவரி (Email ID)</label>
                <div class="input-box-wrapper">
                    <input type="email" id="regEmail" placeholder="example@gmail.com" required>
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label>மொபைல் எண் (Mobile Number)</label>
                <div class="input-box-wrapper">
                    <input type="tel" id="regMobile" placeholder="10 இலக்க மொபைல் எண்" required>
                    <i class="fa-solid fa-mobile-screen"></i>
                </div>
            </div>

            <button type="button" class="btn-submit btn-emerald" onclick="sendRegisterOTP()">
                <i class="fa-solid fa-paper-plane"></i> Send Verification OTP
            </button>

            <!-- Collapsible OTP & Password Section -->
            <div id="regOtpSection" class="collapsible-step">
                <div class="form-group">
                    <label>Mobile OTP Code</label>
                    <div class="input-box-wrapper">
                        <input type="text" id="otpInput" placeholder="6 இலக்க OTP எண்">
                        <i class="fa-solid fa-key"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Create New Password</label>
                    <div class="input-box-wrapper">
                        <input type="password" id="regPassword" placeholder="புதிய கடவுச்சொல்லை உருவாக்கவும்">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="button" class="btn-submit" onclick="completeRegistration()">
                    Complete Registration
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 2: Forgot Password Reset -->
    <div id="forgotModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-icon" onclick="closeModal('forgotModal')"><i class="fa-solid fa-xmark"></i></span>
            
            <div class="modal-heading">
                <i class="fa-solid fa-key" style="color: var(--amber-accent);"></i>
                <span>கடவுச்சொல்லை மீட்டெடுக்க (Reset Password)</span>
            </div>

            <!-- Step 1: Mobile Input -->
            <div id="forgotStep1">
                <div class="form-group">
                    <label>பதிவு செய்த மொபைல் எண்</label>
                    <div class="input-box-wrapper">
                        <input type="tel" id="forgotMobile" placeholder="10 இலக்க மொபைல் எண்" required>
                        <i class="fa-solid fa-mobile-screen"></i>
                    </div>
                </div>

                <button type="button" class="btn-submit btn-amber" onclick="sendForgotOTP()">
                    <i class="fa-solid fa-paper-plane"></i> Get Reset Code
                </button>
            </div>

            <!-- Step 2: Verification & New Password -->
            <div id="forgotStep2" class="collapsible-step">
                <div class="form-group">
                    <label>Reset OTP Code</label>
                    <div class="input-box-wrapper">
                        <input type="text" placeholder="6 இலக்க OTP எண்">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <div class="input-box-wrapper">
                        <input type="password" placeholder="புதிய பாஸ்வேர்ட்">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-box-wrapper">
                        <input type="password" placeholder="மீண்டும் உள்ளிடவும்">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="button" class="btn-submit" onclick="resetPasswordSuccess()">
                    Update & Save Password
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 3: Hidden Creator Access -->
    <div id="creatorModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-icon" onclick="closeModal('creatorModal')"><i class="fa-solid fa-xmark"></i></span>
            
            <div class="modal-heading">
                <i class="fa-solid fa-shield-halved" style="color: #ef4444;"></i>
                <span>Admin / Creator Portal</span>
            </div>

            <div class="form-group">
                <label>Admin Access ID</label>
                <div class="input-box-wrapper">
                    <input type="text" id="adminId" placeholder="Admin ID">
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Security Password</label>
                <div class="input-box-wrapper">
                    <input type="password" id="adminPass" placeholder="Password">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>

            <button type="button" class="btn-submit" style="background: #dc2626;" onclick="handleAdminLogin()">
                Access Admin Dashboard
            </button>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Registration Functions
        function sendRegisterOTP() {
            const mobile = document.getElementById('regMobile').value;
            if(!mobile || mobile.length < 10) {
                alert('தயவுசெய்து சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடுக!');
                return;
            }
            alert('சரிபார்ப்பு OTP உங்கள் மொபைல் எண்ணிற்கு அனுப்பப்பட்டது!');
            document.getElementById('regOtpSection').style.display = 'block';
        }

        function completeRegistration() {
            alert('பதிவு வெற்றிகரமாக முடிந்தது! இப்போது லாகின் செய்யலாம்.');
            closeModal('registerModal');
        }

        // Forgot Password Functions
        function sendForgotOTP() {
            const mobile = document.getElementById('forgotMobile').value;
            if(!mobile || mobile.length < 10) {
                alert('தயவுசெய்து பதிவு செய்த மொபைல் எண்ணை உள்ளிடுக!');
                return;
            }
            alert('Reset OTP உங்கள் மொபைல் எண்ணிற்கு அனுப்பப்பட்டது!');
            document.getElementById('forgotStep2').style.display = 'block';
        }

        function resetPasswordSuccess() {
            alert('உங்கள் பாஸ்வேர்ட் வெற்றிகரமாக புதுப்பிக்கப்பட்டது!');
            closeModal('forgotModal');
        }

        // Login Handlers
        function handleAdminLogin() {
            const id = document.getElementById('adminId').value;
            const pass = document.getElementById('adminPass').value;
            if(id === 'admin' && pass === 'admin123') {
                window.location.href = 'creator.html';
            } else {
                alert('தவறான Admin லாகின் விவரங்கள்!');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
